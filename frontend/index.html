<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetDerma AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --primary:#4F8EF7;
  --primary-dark:#3D74D6;
  --secondary:#6DDCCF;
  --accent:#FFD6A5;
  --success:#34D399;
  --warning:#FBBF24;
  --danger:#EF4444;
  --bg:#F8FAFC;
  --card:#ffffff;
  --card-glass:rgba(255,255,255,0.65);
  --text:#111827;
  --text2:#6B7280;
  --border:rgba(17,24,39,0.08);
  --shadow:0 10px 30px -12px rgba(79,142,247,0.18), 0 2px 8px rgba(17,24,39,0.04);
  --radius:20px;
  --radius-sm:14px;
}
[data-theme="dark"]{
  --bg:#0B1220;
  --card:#131c2e;
  --card-glass:rgba(19,28,46,0.65);
  --text:#F3F6FB;
  --text2:#93A1B7;
  --border:rgba(255,255,255,0.08);
  --shadow:0 10px 30px -12px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .4s ease, color .4s ease;
}
h1,h2,h3,h4,.font-display{font-family:'Poppins',sans-serif;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--primary); color:#fff;}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:6px;}
img{max-width:100%; display:block;}

/* ---------- utility ---------- */
.glass{
  background:var(--card-glass);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid var(--border);
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .25s ease, box-shadow .25s ease;
}
.card:hover{transform:translateY(-3px); box-shadow:0 16px 40px -14px rgba(79,142,247,0.28), 0 4px 10px rgba(17,24,39,0.06);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:14px; padding:13px 22px; font-weight:600; font-size:14.5px;
  position:relative; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease, opacity .18s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),#6AA3FA); color:#fff; box-shadow:0 8px 20px -6px rgba(79,142,247,0.55);}
.btn-primary:hover{box-shadow:0 10px 26px -6px rgba(79,142,247,0.7);}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#8CEFE3); color:#064e42;}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--text2);}
.btn-ripple::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.5) 0%,transparent 60%);opacity:0;transition:opacity .4s;}
.btn-ripple:active::after{opacity:1;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;}
.pill-success{background:rgba(52,211,153,.14); color:#0d9668;}
.pill-warning{background:rgba(251,191,36,.16); color:#b45309;}
.pill-danger{background:rgba(239,68,68,.13); color:#c62828;}
.pill-primary{background:rgba(79,142,247,.13); color:var(--primary-dark);}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.fade-in{animation:fadeIn .5s ease both;}
.slide-up{animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes slideUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(79,142,247,.16), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(109,220,207,.20), transparent 50%),
    linear-gradient(160deg,#ffffff 0%, #F3F9FF 45%, #EFFCFA 100%);
  padding:32px;
  transition:opacity .5s ease, visibility .5s;
}
[data-theme="dark"] #splash{background:radial-gradient(circle at 15% 20%, rgba(79,142,247,.14), transparent 45%), radial-gradient(circle at 85% 75%, rgba(109,220,207,.10), transparent 50%), linear-gradient(160deg,#0B1220 0%, #0d1729 100%);}
#splash.hidden{opacity:0; visibility:hidden; pointer-events:none;}
.splash-illustration{width:min(320px,70vw); margin-bottom:8px;}
.logo-row{display:flex; align-items:center; gap:10px; margin-top:18px;}
.logo-mark{width:38px;height:38px;}
.logo-text{font-family:'Poppins'; font-weight:800; font-size:26px; letter-spacing:-.5px;}
.logo-text span{color:var(--primary);}
.splash-tag{font-size:15px; color:var(--text2); margin-top:10px; max-width:360px; font-weight:500;}
.splash-sub{font-size:13px; color:var(--primary-dark); margin-top:6px; font-weight:600; letter-spacing:.3px;}
.splash-buttons{display:flex; gap:14px; margin-top:34px;}
.scan-sweep{position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--secondary),transparent); animation:sweep 2.6s ease-in-out infinite;}
@keyframes sweep{0%{top:22%; opacity:0;}10%{opacity:1;}50%{top:78%; opacity:1;}60%{opacity:0;}100%{top:78%; opacity:0;}}

/* ---------- AUTH ---------- */
#auth{position:fixed; inset:0; z-index:90; display:none; background:var(--bg);}
#auth.active{display:flex;}
.auth-visual{flex:1; position:relative; overflow:hidden; background:linear-gradient(160deg,#4F8EF7,#3D74D6 55%,#2b5bb0); display:flex; align-items:center; justify-content:center;}
.auth-visual svg{width:78%;}
.auth-visual-text{position:absolute; bottom:48px; left:48px; right:48px; color:#fff;}
.auth-visual-text h2{font-size:26px; margin-bottom:8px;}
.auth-visual-text p{opacity:.85; font-size:14.5px; max-width:420px;}
.auth-form-side{flex:1; display:flex; align-items:center; justify-content:center; padding:40px;}
.auth-box{width:100%; max-width:400px;}
.auth-tabs{display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:4px; margin-bottom:28px;}
.auth-tab{flex:1; text-align:center; padding:10px; border-radius:11px; font-weight:600; font-size:14px; color:var(--text2); border:none; background:transparent;}
.auth-tab.active{background:var(--primary); color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:7px; color:var(--text2);}
.field input, .field select{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--card); color:var(--text); font-size:14.5px; transition:border-color .2s;
}
.field input:focus, .field select:focus{border-color:var(--primary);}
.field-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text2); margin-bottom:20px;}
.check-row{display:flex; align-items:center; gap:7px;}
.auth-divider{display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text2); font-size:12.5px;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border);}
.auth-panel{display:none;}
.auth-panel.active{display:block;}

/* ---------- APP SHELL ---------- */
#app-shell{display:none;}
#app-shell.active{display:flex;}
.sidebar{
  width:250px; flex-shrink:0; height:100vh; position:sticky; top:0;
  border-right:1px solid var(--border); background:var(--card);
  display:flex; flex-direction:column; padding:22px 16px;
}
.side-logo{display:flex; align-items:center; gap:10px; padding:6px 10px 26px;}
.side-logo .logo-mark{width:30px; height:30px;}
.side-logo span{font-family:'Poppins'; font-weight:800; font-size:18px;}
.nav-group-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text2); font-weight:700; margin:14px 10px 8px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
  color:var(--text2); font-weight:600; font-size:14px; border:none; background:transparent; width:100%; text-align:left;
  transition:background .18s, color .18s;
}
.nav-item:hover{background:rgba(79,142,247,.08); color:var(--primary);}
.nav-item.active{background:linear-gradient(135deg,var(--primary),#6AA3FA); color:#fff; box-shadow:0 6px 16px -6px rgba(79,142,247,.5);}
.sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--border); background:var(--card-glass);
  backdrop-filter:blur(14px);
}
.search-box{
  flex:1; max-width:420px; display:flex; align-items:center; gap:10px;
  background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:9px 14px; color:var(--text2);
}
.search-box input{border:none; background:transparent; outline:none; width:100%; color:var(--text); font-size:14px;}
.topbar-actions{display:flex; align-items:center; gap:10px; margin-left:auto;}
.icon-btn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--text2); position:relative; transition:.2s;
}
.icon-btn:hover{color:var(--primary); border-color:var(--primary);}
.badge-dot{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--card);}
.avatar{
  width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg,var(--secondary),var(--primary));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
}
.content{padding:28px; flex:1;}
.screen{display:none;}
.screen.active{display:block;}
.screen-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.screen-head h1{font-size:26px; font-weight:700;}
.screen-head p{color:var(--text2); font-size:14px; margin-top:4px;}

/* grid systems */
.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; margin-bottom:24px;}
.stat-card{padding:20px 22px;}
.stat-top{display:flex; justify-content:space-between; align-items:flex-start;}
.stat-icon{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center;}
.stat-value{font-family:'Poppins'; font-size:28px; font-weight:700; margin-top:14px;}
.stat-label{color:var(--text2); font-size:13px; margin-top:2px;}
.stat-trend{font-size:12px; font-weight:700; margin-top:10px;}

.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-bottom:24px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-3{grid-template-columns:1fr;}}

.panel{padding:22px;}
.panel-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.panel-title h3{font-size:16px; font-weight:700;}
.chip-row{display:flex; gap:8px;}
.chip{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--border); color:var(--text2); background:var(--bg);}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.quick-actions{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
@media(max-width:900px){.quick-actions{grid-template-columns:1fr 1fr;}}
.qa-card{padding:20px; text-align:left; border:1px solid var(--border); background:var(--card);}
.qa-icon{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
.qa-card h4{font-size:14.5px; font-weight:700; margin-bottom:2px;}
.qa-card p{font-size:12.5px; color:var(--text2);}

.report-row{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border);}
.report-row:last-child{border-bottom:none;}
.report-thumb{width:44px; height:44px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.report-info{flex:1; min-width:0;}
.report-info h5{font-size:14px; font-weight:600;}
.report-info span{font-size:12px; color:var(--text2);}

.insight-card{padding:20px; background:linear-gradient(135deg, rgba(79,142,247,.08), rgba(109,220,207,.12)); border:1px solid var(--border);}
.insight-card h4{font-size:14.5px; margin-bottom:6px;}
.insight-card p{font-size:13px; color:var(--text2); line-height:1.55;}

/* ---------- SCAN SCREEN ---------- */
.animal-select{display:flex; gap:14px; margin-bottom:22px;}
.animal-opt{
  flex:1; padding:18px; border-radius:16px; border:2px solid var(--border); background:var(--card);
  display:flex; align-items:center; gap:14px; transition:.2s;
}
.animal-opt.selected{border-color:var(--primary); background:rgba(79,142,247,.06); box-shadow:0 0 0 4px rgba(79,142,247,.1);}
.animal-opt .icon{width:30px; height:30px; color:var(--primary);}
.animal-opt h4{font-size:15px;}
.animal-opt span{font-size:12px; color:var(--text2);}

.dropzone{
  border:2px dashed var(--border); border-radius:var(--radius); padding:48px 24px; text-align:center;
  background:var(--card); position:relative; overflow:hidden; transition:.25s;
}
.dropzone.drag{border-color:var(--primary); background:rgba(79,142,247,.05);}
.dropzone .icon{width:46px; height:46px; color:var(--primary); margin:0 auto 14px;}
.dropzone h3{font-size:16px; margin-bottom:6px;}
.dropzone p{font-size:13px; color:var(--text2); margin-bottom:18px;}
.dz-buttons{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.dz-formats{margin-top:16px; font-size:11.5px; color:var(--text2);}

.preview-wrap{position:relative; border-radius:var(--radius); overflow:hidden; background:#000; max-width:460px; margin:0 auto;}
.preview-wrap img{width:100%; display:block; max-height:420px; object-fit:cover;}
.scan-overlay{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(11,18,32,.55); color:#fff; gap:14px;}
.scan-overlay.active{display:flex;}
.scan-line{position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--secondary) 20%,#fff 50%,var(--secondary) 80%,transparent); box-shadow:0 0 18px 4px rgba(109,220,207,.7); animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%{top:6%} 50%{top:92%} 100%{top:6%}}
.scan-grid{position:absolute; inset:0; background-image:linear-gradient(rgba(109,220,207,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(109,220,207,.18) 1px,transparent 1px); background-size:24px 24px; opacity:.6;}
.scan-percent{font-family:'Poppins'; font-size:30px; font-weight:700;}
.scan-status{font-size:13px; opacity:.85;}

/* ---------- RESULTS ---------- */
.result-hero{display:grid; grid-template-columns:340px 1fr; gap:22px; margin-bottom:22px;}
@media(max-width:900px){.result-hero{grid-template-columns:1fr;}}
.heat-frame{position:relative; border-radius:var(--radius); overflow:hidden;}
.heat-frame img{width:100%; height:320px; object-fit:cover;}
.heat-overlay{position:absolute; inset:0; background:radial-gradient(circle at 42% 55%, rgba(239,68,68,.55), rgba(251,191,36,.35) 35%, transparent 65%); mix-blend-mode:multiply;}
.heat-tag{position:absolute; bottom:12px; left:12px; background:rgba(11,18,32,.7); color:#fff; font-size:11.5px; padding:5px 10px; border-radius:8px;}

.gauge-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
.gauge{position:relative; width:120px; height:120px;}
.gauge svg{transform:rotate(-90deg);}
.gauge-value{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-value b{font-family:'Poppins'; font-size:22px;}
.gauge-value span{font-size:11px; color:var(--text2);}

.detail-list{list-style:none; margin-top:8px;}
.detail-list li{display:flex; gap:10px; padding:8px 0; font-size:14px; border-bottom:1px dashed var(--border); align-items:flex-start;}
.detail-list li:last-child{border:none;}
.detail-list li .icon{width:16px; height:16px; margin-top:3px; color:var(--primary);}

.tab-strip{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.tab-btn{padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--text2); border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--primary); border-color:var(--primary);}
.tab-content{display:none;}
.tab-content.active{display:block; animation:fadeIn .35s ease;}

/* ---------- HISTORY table ---------- */
.filters-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.filters-row select, .filters-row input{padding:10px 12px; border-radius:11px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:13.5px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{text-align:left; padding:12px 14px; color:var(--text2); font-weight:600; border-bottom:1px solid var(--border); font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;}
tbody td{padding:13px 14px; border-bottom:1px solid var(--border);}
tbody tr:hover{background:rgba(79,142,247,.05);}
.table-wrap{overflow-x:auto;}

/* prevention checklist */
.prevent-cat{margin-bottom:14px; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--card);}
.prevent-head{display:flex; align-items:center; gap:12px; padding:16px 18px; width:100%; background:none; border:none; text-align:left; font-weight:700; font-size:14.5px;}
.prevent-head .chev{margin-left:auto; transition:transform .25s;}
.prevent-cat.open .chev{transform:rotate(180deg);}
.prevent-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.prevent-cat.open .prevent-body{max-height:400px;}
.prevent-items{padding:0 18px 16px 60px; display:flex; flex-direction:column; gap:10px;}
.check-item{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text2);}
.check-item input{accent-color:var(--primary); width:16px; height:16px;}

/* profile / settings */
.profile-head{display:flex; align-items:center; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
.profile-photo{width:88px; height:88px; border-radius:22px; background:linear-gradient(135deg,var(--secondary),var(--primary)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; font-weight:700;}
.settings-list{display:flex; flex-direction:column;}
.settings-item{display:flex; align-items:center; gap:14px; padding:16px 4px; border-bottom:1px solid var(--border);}
.settings-item:last-child{border:none;}
.settings-item .icon{color:var(--primary);}
.settings-item h5{font-size:14px;}
.settings-item span{font-size:12.5px; color:var(--text2);}
.switch{width:42px; height:24px; border-radius:99px; background:var(--border); position:relative; border:none; margin-left:auto; flex-shrink:0; transition:.2s;}
.switch::after{content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.3);}
.switch.on{background:var(--primary);}
.switch.on::after{left:21px;}

/* bottom nav mobile */
.bottom-nav{display:none; position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--card-glass); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:8px 4px 10px;}
.bottom-nav-inner{display:flex; justify-content:space-around;}
.bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text2); background:none; border:none; font-size:10px; font-weight:600; padding:6px 8px; border-radius:10px;}
.bn-item.active{color:var(--primary);}
.bn-item .icon{width:20px; height:20px;}

@media(max-width:960px){
  .sidebar{display:none;}
  .bottom-nav{display:block;}
  .content{padding:18px; padding-bottom:90px;}
  .topbar{padding:14px 18px;}
  .search-box{display:none;}
  .grid-2{grid-template-columns:1fr;}
}
@media(max-width:480px){
  .quick-actions{grid-template-columns:1fr 1fr;}
  .grid-stats{grid-template-columns:1fr 1fr;}
}
.skeleton{background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,.4) 37%, var(--border) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0} 100%{background-position:-100% 0}}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->

/* =========================================================
   NAVIGATION
   ========================================================= */
function goAuth(mode){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('auth').classList.add('active');
  switchAuth(mode);
}
function switchAuth(mode){
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-register').classList.toggle('active', mode==='register');
  document.getElementById('panel-login').classList.toggle('active', mode==='login');
  document.getElementById('panel-register').classList.toggle('active', mode==='register');
}
function enterApp(){
  document.getElementById('auth').classList.remove('active');
  document.getElementById('app-shell').classList.add('active');
  showScreen('dashboard');
}
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const target = document.getElementById('screen-'+name);
  if(target){ target.classList.add('active'); }
  document.querySelectorAll('[data-screen]').forEach(el=>{
    el.classList.toggle('active', el.dataset.screen===name);
  });
  document.getElementById('content').scrollTop = 0;
  if(name==='analytics') setTimeout(renderAnalyticsCharts, 50);
  if(name==='dashboard') setTimeout(renderDashboardCharts, 50);
}
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-screen]');
  if(el){ showScreen(el.dataset.screen); }
});

              <linearGradient id="gradG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#4F8EF7"/>
                <stop offset="100%" stop-color="#6DDCCF"/>

let selectedAnimal = 'cow';
function selectAnimal(type){
  selectedAnimal = type;
  document.querySelectorAll('.animal-opt').forEach(el=>el.classList.toggle('selected', el.dataset.animal===type));
}
function resetScan(){
  document.getElementById('dz-area').style.display='block';
  document.getElementById('preview-area').style.display='none';
}
function initScanUpload(){
  selectAnimal('cow');
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('file-input');
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault(); dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault(); dz.classList.remove('drag');}));
  dz.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) loadPreview(e.dataTransfer.files[0]); });
  input.addEventListener('change', e=>{ if(e.target.files[0]) loadPreview(e.target.files[0]); });
}
function loadPreview(file){
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('dz-area').style.display='none';
    document.getElementById('preview-area').style.display='block';
  };
  reader.readAsDataURL(file);
}
async function startAnalysis(){

  const fileInput = document.getElementById("file-input");

  if(fileInput.files.length===0){
      alert("Please select an image first.");
      return;
  }

  const overlay=document.getElementById('scan-overlay');
  const pct=document.getElementById('scan-percent');
  const status=document.getElementById('scan-status');
  const btn=document.getElementById('analyze-btn');

  overlay.classList.add('active');
  btn.disabled=true;

  pct.innerHTML="0%";
  status.innerHTML="Uploading Image...";

  const formData=new FormData();

  formData.append("animal",selectedAnimal);
  formData.append("image",fileInput.files[0]);

  try{

      pct.innerHTML="40%";
      status.innerHTML="Running AI Model...";

      fetch(`${API_URL}/predict`, {

          method:"POST",
          body:formData

      });

      const data=await response.json();

      pct.innerHTML="100%";
      status.innerHTML="Prediction Completed";

      setTimeout(() => {

    overlay.classList.remove("active");
    btn.disabled = false;

    const result = {
        animal: data.animal,
        confidence: data.confidence,
        time: new Date().toLocaleString(),
        imgSrc: document.getElementById("preview-img").src,

        disease: {
            name: data.disease,
            severity: data.severity,
            symptoms: data.symptoms,
            causes: data.causes,
            treatment: data.treatment,
            recommendation: data.recommendation
        }
    };

    currentResult = result;

    renderResults(result);
    

    showScreen("results");

}, 500);

  }

  catch(error){

      overlay.classList.remove("active");
      btn.disabled=false;

      alert("Backend not connected");

      console.log(error);

  }

}

function downloadReport(){
  if(!currentResult){ alert('Run a scan first to generate a report.'); return; }
  const r = currentResult;
  const text = `VetDerma AI - Diagnosis Report
Animal: ${r.animal}
Disease: ${r.disease.name}
Confidence: ${r.confidence}%
Severity: ${r.disease.severity}
Time: ${r.time}

Symptoms:
${r.disease.symptoms.map(s=>'- '+s).join('\n')}

Recommended Treatment:
${r.disease.treatment.map(s=>'- '+s).join('\n')}
`;
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vetderma-report.txt';
  a.click();
}
function shareReport(){
  if(!currentResult){ alert('Run a scan first to generate a report.'); return; }
  alert('Share link copied to clipboard (demo).');
}

async function registerUser() {

    const name = document.getElementById("re-name").value.trim();
    const email = document.getElementById("re-email").value.trim();
    const password = document.getElementById("re-pass").value;

    if (name === "" || email === "" || password === "") {
        alert("Please fill all fields");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
    }

    try {

        fetch(`${API_URL}/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {

            alert("Registration Successful!");

            // Clear registration fields
            document.getElementById("re-name").value = "";
            document.getElementById("re-email").value = "";
            document.getElementById("re-pass").value = "";

            // Go to login
            switchAuth("login");

            // Automatically fill email
            document.getElementById("li-email").value = email;

        } else {

            alert(data.message || "Registration failed");

        }

    } catch (error) {

        console.error("Registration error:", error);

        alert("Cannot connect to backend. Make sure Flask is running.");

    }
}


async function loginUser() {

    const email = document.getElementById("li-email").value.trim();
    const password = document.getElementById("li-pass").value;

    if (email === "" || password === "") {
        alert("Please enter email and password");
        return;
    }

    try {

        fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {

            // Save logged-in user
            localStorage.setItem(
                "vetderma_user",
                JSON.stringify(data.user)
            );

            alert("Login Successful!");

            // Clear password
            document.getElementById("li-pass").value = "";

            // Open application
            enterApp();

        } else {

            alert(data.message || "Invalid email or password");

        }

    } catch (error) {

        console.error("Login error:", error);

        alert("Cannot connect to backend. Make sure Flask is running.");

    }
}
